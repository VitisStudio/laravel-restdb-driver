name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs outside the test matrix on purpose. The matrix pins the root
  # composer.json to one cell's versions ('12.*') before installing, which by
  # design no longer matches the packages' declared ranges — validate would
  # then report a conflict that exists only in CI. It checks the committed
  # tree, so it needs an unpinned checkout.
  validate:
    runs-on: ubuntu-latest
    name: Monorepo validate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # composer.lock is gitignored, so resolve fresh rather than install.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Monorepo validate
        run: vendor/bin/monorepo-builder validate --ansi

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - laravel: '13.*'
            php: '8.2'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest
        run: vendor/bin/pest --ci

  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: laravel/framework@dev canary
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Track laravel/framework itself, not the illuminate/* read-only splits:
      # the framework `replace`s those, so requiring both concrete split
      # packages and the framework (pulled in by testbench) is unsatisfiable.
      #
      # Pin the branch rather than dev-master — the framework's stale
      # branch-alias maps dev-master to 13.0.x-dev, which cannot satisfy
      # testbench's ^13.23.0. Bump both branches when Laravel 14 opens.
      - name: Install bleeding-edge framework
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require "laravel/framework:13.x-dev" --no-interaction --no-update
          composer require "orchestra/testbench:11.x-dev" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: vendor/bin/pest --ci
