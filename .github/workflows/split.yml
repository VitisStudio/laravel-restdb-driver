name: Split Packages

# On every tag, push each package directory to its read-only mirror so
# Packagist can serve vitisstudio/restdb-contracts, vitisstudio/restdb,
# vitisstudio/restdb-jsonapi, and vitisstudio/restdb-openapi as individually
# installable packages.
#
# Prerequisites:
#   1. The four target repositories exist under the VitisStudio organization.
#   2. A SPLIT_ACCESS_TOKEN secret holds a token with write access to them
#      (classic: 'repo' scope; fine-grained: Contents read/write on each).
# The action pushes the package directory to the target's default branch and
# creates the tag there; it does not need the monorepo's full history.

on:
  push:
    tags: ['*']

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: contracts, repo: restdb-contracts }
          - { dir: core, repo: restdb }
          - { dir: jsonapi, repo: restdb-jsonapi }
          - { dir: openapi, repo: restdb-openapi }
    steps:
      - uses: actions/checkout@v4

      # Renamed from symplify/monorepo-split-github-action; the old path only
      # resolves through a redirect.
      - uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_ACCESS_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          package_directory: packages/${{ matrix.package.dir }}
          repository_organization: VitisStudio
          repository_name: ${{ matrix.package.repo }}
          user_name: vitis-bot
          user_email: dan@vitis.studio
